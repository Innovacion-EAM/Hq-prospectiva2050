# ── Traefik: routers (config DINÁMICA) ──────────────────────────────
# Define "quién va a dónde". Se recarga en caliente (file.watch: true).
# PRIORIDAD: traefik ordena por longitud de regla → /api y /admin
# ganan al catch-all "/". No hace falta declarar priority explícita.
#
# El dominio está escrito a mano en "Host(`localhost`)", y para producción se
# reescribe con:  make traefik-host HOST=prospectivaquindio2050.com
# (lee HQ_SITE_HOST de infra/compose/.env.prod si no se pasa HOST=).
#
# Ojo: NO se usa ${HQ_SITE_HOST} en este archivo. El file provider de Traefik
# v3.5 NO sustituye variables de entorno en la configuración dinámica: la
# regla se toma literal y el Host queda vacío, así que ningún router coincide
# y todo devuelve 404.

http:
  routers:
    # /  → frontend (catch-all)
    frontend:
      rule: "Host(`localhost`) && PathPrefix(`/`)"
      entryPoints:
        - web
      service: frontend

    # /admin → backoffice (SPA servido bajo subruta)
    backoffice:
      rule: "Host(`localhost`) && PathPrefix(`/admin`)"
      entryPoints:
        - web
      service: backoffice

    # /api → backend (el backend responde bajo su prefijo global /api, así que
    # aquí la petición se pasa tal cual; ver backend/src/app.setup.ts)
    api:
      rule: "Host(`localhost`) && PathPrefix(`/api`)"
      entryPoints:
        - web
      service: api

    # ╔══════════════════════════════════════════════════════════════════╗
    # ║ VARIANTE HOST-BASED (alternativa)                                ║
    # ║ Para activarla: descomentar estos 3 routers, comentar los de      ║
    # ║ arriba, y cambiar además:                                         ║
    # ║  - front/back .env.docker: VITE_API_URL=http://api.localhost      ║
    # ║  - backend  .env.docker : CORS_ORIGINS=http://localhost,          ║
    # ║                                  http://backoffice.localhost      ║
    # ║  Los navegadores resuelven *.localhost → 127.0.0.1;               ║
    # ║  si no, agrega 2 líneas a /etc/hosts.                             ║
    # ║ ⚠ Ninguna variante usa middleware: el prefijo /api lo pone el    ║
