# ── Traefik: routers (config DINÁMICA) ──────────────────────────────
# Define "quién va a dónde". Se recarga en caliente (file.watch: true).
# PRIORIDAD: traefik ordena por longitud de regla → /api, /admin y /repo
# ganan al catch-all "/". No hace falta declarar priority explícita.
#
# ⚠ El host NO está escrito a mano: sale de la variable de entorno HQ_SITE_HOST
#   que recibe el contenedor traefik (docker-compose.yml). Así el mismo archivo
#   sirve para docker local (HQ_SITE_HOST=localhost) y para producción con
#   dominio real (HQ_SITE_HOST=horizontequindio2050.com, en .env.prod).
#   Cambia el host -> cambia solo .env.prod y recrea traefik (no basta un
#   restart: `restart` no relee el entorno del contenedor). deploy.sh recrea
#   Traefik solo si detecta que cambió la config estática del proxy
#   (infra/traefik/traefik.yml); para forzarlo a mano:
#   HQ_TRAEFIK_RESTART=1 bash scripts/deploy/deploy.sh
#   Traefik v3 usa la función `env` en el provider de archivos (ver traefik.yml).
#   Además de HQ_SITE_HOST, la regla acepta cualquier IP (acceso a la instancia
#   por IP pública) y `localhost` (docker local).
#
#   CANÓNICO: HQ_SITE_HOST es el dominio canónico (apex, sin www). El router
#   `www-redirect` manda www.<dominio> a él con un 301 (SEO: una sola URL).
#
#   TLS/ACME: los routers con `tls:` declaran los dominios EXPLÍCITOS en
#   `tls.domains` (apex + www). Es IMPRESCINDIBLE: el parser de dominios de
#   ACME no entiende la regla compuesta `Host(...) || HostRegexp(^[0-9.]+$) ||
#   Host(localhost)` y, sin `domains`, falla con "Error parsing domains in
#   provider ACME" y NO emite el certificado (se serviría el certificado
#   interno de Traefik, inválido para el navegador).

http:
  routers:
    # / → frontend (catch-all)
    frontend:
      rule: '(Host(`{{ env "HQ_SITE_HOST" }}`) || HostRegexp(`^[0-9.]+$`) || Host(`localhost`)) && PathPrefix(`/`)'
      entryPoints:
        - web
        - websecure
      tls:
        certResolver: letsencrypt
        # Dominios explícitos para ACME (ver nota en la cabecera del archivo).
        domains:
          - main: '{{ env "HQ_SITE_HOST" }}'
            sans:
              - 'www.{{ env "HQ_SITE_HOST" }}'
      service: frontend

    # /admin → backoffice (SPA servida bajo subruta)
    # El middleware strip-admin le quita /admin, igual que strip-repo hace con
    # /repo. Así nginx sirve el panel en "/" con su try_files normal. Si no se
    # quitara el prefijo, nginx tendría que resolver /admin/** con `alias`, y
    # `try_files $uri` dentro de un `alias` busca contra el root del server y no
    # contra el alias: los assets devolverían 500 y el panel saldría en blanco.
    backoffice:
      rule: '(Host(`{{ env "HQ_SITE_HOST" }}`) || HostRegexp(`^[0-9.]+$`) || Host(`localhost`)) && PathPrefix(`/admin`)'
      entryPoints:
        - web
        - websecure
      tls:
        certResolver: letsencrypt
        # Dominios explícitos para ACME (ver nota en la cabecera del archivo).
        domains:
          - main: '{{ env "HQ_SITE_HOST" }}'
            sans:
              - 'www.{{ env "HQ_SITE_HOST" }}'
      middlewares:
        - strip-admin
      service: backoffice

    # /repo → repositorio de información (SPA bajo subruta, como /admin)
    repo:
      rule: '(Host(`{{ env "HQ_SITE_HOST" }}`) || HostRegexp(`^[0-9.]+$`) || Host(`localhost`)) && PathPrefix(`/repo`)'
      entryPoints:
        - web
        - websecure
      tls:
        certResolver: letsencrypt
        # Dominios explícitos para ACME (ver nota en la cabecera del archivo).
        domains:
          - main: '{{ env "HQ_SITE_HOST" }}'
            sans:
              - 'www.{{ env "HQ_SITE_HOST" }}'
      middlewares:
        - strip-repo
      service: repo

    # /api → backend (el backend responde bajo su prefijo global /api, así que
    # aquí la petición se pasa tal cual; ver backend/src/app.setup.ts).
    # NO hay strip-api: el frontend, el backoffice y el repositorio piden
    # `${API_BASE}/api/...` con API_BASE = origen (sin /api), y el backend
    # aplica el prefijo global. Si se recortara /api aquí, la petición llegaría
    # a una ruta que no existe y el sitio caería al contenido de respaldo.
    api:
      rule: '(Host(`{{ env "HQ_SITE_HOST" }}`) || HostRegexp(`^[0-9.]+$`) || Host(`localhost`)) && PathPrefix(`/api`)'
      entryPoints:
        - web
        - websecure
      tls:
        certResolver: letsencrypt
        # Dominios explícitos para ACME (ver nota en la cabecera del archivo).
        domains:
          - main: '{{ env "HQ_SITE_HOST" }}'
            sans:
              - 'www.{{ env "HQ_SITE_HOST" }}'
      service: api

    # www → dominio canónico (301). SEO: evita que el mismo sitio se indexe dos
    # veces (con y sin www); Google ve una sola URL. El middleware
    # `redirect-www` (middlewares.yml) conserva el esquema.
    #
    # Lleva `tls` con los dominios explícitos para que el certificado cubra
    # también el nombre con www (el de apex lo emiten los routers de arriba).
    www-redirect:
      rule: 'Host(`www.{{ env "HQ_SITE_HOST" }}`)'
      entryPoints:
        - web
        - websecure
      tls:
        certResolver: letsencrypt
        # Dominios explícitos para ACME (ver nota en la cabecera del archivo).
        domains:
          - main: '{{ env "HQ_SITE_HOST" }}'
            sans:
              - 'www.{{ env "HQ_SITE_HOST" }}'
      middlewares:
        - redirect-www
      service: noop@internal

    # ╔══════════════════════════════════════════════════════════════════╗
    # ║ VARIANTE HOST-BASED (alternativa)                                ║
    # ║ Para activarla: descomentar estos 4 routers, comentar los de      ║
    # ║ arriba, y cambiar además:                                         ║
    # ║  - front/back/repo .env.docker: VITE_API_URL=http://api.localhost ║
    # ║  - backend  .env.docker : CORS_ORIGINS=http://localhost,          ║
    # ║                                  http://backoffice.localhost      ║
    # ║  Los navegadores resuelven *.localhost → 127.0.0.1;               ║
    # ║  si no, agrega 2 líneas a /etc/hosts.                             ║
    # ║  ⚠ Ninguna variante usa middleware: el prefijo /api lo pone el    ║
    # ║  backend (prefijo global de Nest) y aquí se pasa la petición      ║
    # ╚══════════════════════════════════════════════════════════════════╝
