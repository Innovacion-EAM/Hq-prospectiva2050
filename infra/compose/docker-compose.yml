name: hq-prospectiva2050

services:
  postgres:
    image: postgres:16-alpine
    container_name: hq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hq_prospectiva2050}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hq_prospectiva2050}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hq-net

  backend:
    build:
      context: ../../backend
    container_name: hq-backend
    restart: unless-stopped
    env_file:
      - ../../backend/.env.docker
    environment:
      APP_ENV: docker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - hq-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hq-net

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_MODE: docker
        # Constantes de build, no secretos. Se pueden sobreescribir desde
        # infra/compose/.env sin tocar este archivo.
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
    container_name: hq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hq-net

  backoffice:
    build:
      context: ../../backoffice
      args:
        VITE_MODE: docker
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
    container_name: hq-backoffice
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hq-net

  traefik:
    image: traefik:v3.5
    container_name: hq-traefik
    restart: unless-stopped
    environment:
      # Host que matchean los routers de infra/traefik/dynamic/routes.yml.
      # Se define aquí para que la variable NUNCA falte (una regla vacía rompe
      # todos los routers). Se sobreescribe con infra/compose/.env.prod
      # (=dominio real) al desplegar en producción.
      HQ_SITE_HOST: ${HQ_SITE_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      backoffice:
        condition: service_healthy
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      # Certificados TLS. Necesario para la vía de certificados manuales
      # (infra/traefik/certs/, gitignored) y para el acme.json del resolver de
      # Let's Encrypt. La carpeta se crea vacía; no afecta al arranque.
      - ../traefik/certs:/etc/traefik/certs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hq-net

volumes:
  pgdata:
  hq-uploads:

networks:
  hq-net:
    driver: bridge