server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Mismo criterio que el backoffice, y por el mismo motivo: los assets llevan
    # el hash de su contenido, así que se cachean para siempre, y uno que no
    # existe tiene que ser un 404. Si aquí hubiera `try_files`, un bundle de una
    # versión anterior que el navegador tiene en caché se resolvería al index.html
    # con un 200 y `text/html`, el navegador lo rechazaría por el tipo MIME y la
    # página quedaría en blanco sin que nada pareciera un error.
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El index.html nunca se cachea: es el que apunta al bundle actual.
    location = /index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}