# ── Traefik: middlewares (config DINÁMICA) ──────────────────────────
# Transformaciones aplicadas al request ANTES de entrar al servicio.
#
# En este proyecto no hay middlewares de ruta: el prefijo `/api` lo pone el
# propio backend (prefijo global, ver backend/src/app.setup.ts) y el frontend
# SIEMPRE pide con `/api` delante, así que Traefik pasa la petición tal cual.
# Si en el futuro se necesitara uno (headers CORS, límites, etc.), se define
# aquí y se referencia desde routes.yml.
#
# OJO: Traefik rechaza este archivo si `http:` queda vacío ("http cannot be a
# standalone element"), por eso este archivo es solo documentación: sin
# middlewares definidos, Traefik no encuentra configuración que aplicar.