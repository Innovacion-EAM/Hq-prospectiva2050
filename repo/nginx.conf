server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # El repositorio vive bajo /repo, pero traefik le quita ese prefijo con el
    # middleware `strip-repo` antes de que la petición llegue aquí. Por eso nginx
    # solo sirve en "/": el index.html pide /repo/assets/… (base de Vite),
    # traefik lo entrega como /assets/… y try_files lo encuentra en la raíz.
    #
    # No usar `alias` + `try_files $uri` para /repo: dentro de un `alias`,
    # try_files resuelve $uri contra el root del server, no contra el alias, y
    # los assets devuelven 500 (repositorio en blanco). Para servir bajo
    # subruta, quita el prefijo en traefik; no en nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}