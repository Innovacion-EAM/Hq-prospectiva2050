<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El CSS usa Montserrat y Source Sans 3 (--font-display / --font-sans).
         Sin estas etiquetas el panel se caía a las fuentes del sistema y se
         veía distinto al sitio público. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Backoffice · Horizonte Quindío 2050</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Si la aplicación no monta en 8 s es que su bundle no se cargó. La causa
         casi siempre es la misma: el navegador tiene en caché un index.html de
         una versión anterior, que apunta a un archivo que ya no existe, y el
         navegador rechaza ejecutarlo porque le llega HTML donde esperaba
         JavaScript. Antes de dejar la pantalla en blanco sin decir nada, se
         explica qué pasó y cómo se arregla. Va con estilos en línea a propósito:
         en este momento tampoco se puede contar con que haya cargado el CSS. -->
    <script>
      setTimeout(function () {
        var raiz = document.getElementById("root");
        if (raiz && raiz.childElementCount > 0) return;
        document.body.innerHTML =
          '<div style="max-width:34rem;margin:12vh auto;padding:0 1.5rem;font-family:system-ui,sans-serif;color:#0B3336">' +
          '<h1 style="font-size:1.3rem;margin:0 0 .8rem">La página no pudo cargar</h1>' +
          '<p style="margin:0 0 .8rem;line-height:1.6">El navegador tiene guardada una versi&oacute;n anterior de esta p&aacute;gina, que apunta a archivos que ya no existen. Es la cach&eacute; del navegador, no un cambio en el c&oacute;digo.</p>' +
          '<p style="margin:0;line-height:1.6"><strong>Recarga sin cach&eacute;:</strong> pulsa <strong>Ctrl + Shift + R</strong> (en Mac, <strong>Cmd + Shift + R</strong>). Si no basta, cierra la pestaña y &aacute;brela de nuevo.</p>' +
          "</div>";
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
