server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # El panel vive bajo /admin, pero traefik le quita ese prefijo con el
    # middleware `strip-admin` antes de que la petición llegue aquí. Por eso nginx
    # solo sirve en "/": el index.html pide /admin/assets/… (base de Vite),
    # traefik lo entrega como /assets/… y try_files lo encuentra en la raíz.
    #
    # No usar `alias` + `try_files $uri` para /admin: dentro de un `alias`,
    # try_files resuelve $uri contra el root del server, no contra el alias, y
    # los assets devuelven 500 (panel en blanco). Para servir el panel bajo
    # subruta, quita el prefijo en traefik; no en nginx.

    # Mismo criterio que el sitio público, y por el mismo motivo: los assets
    # llevan el hash de su contenido y se pueden cachear para siempre, pero el
    # index.html NO. Sin este `no-cache`, el navegador se quedaba con el
    # index.html viejo —y con él, el bundle viejo— después de cada despliegue, así
    # que los arreglos del panel no llegaban a verse aunque estuvieran publicados.
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}