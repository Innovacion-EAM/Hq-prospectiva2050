server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Los assets llevan el hash de su contenido en el nombre, así que se pueden
    # cachear para siempre: si el nombre es el mismo, el contenido es el mismo.
    #
    # Aquí no hay `try_files` a propósito. Con él, un asset que no existe caería
    # al index.html y nginx respondería 200 con `Content-Type: text/html`. El
    # navegador pediría entonces el bundle de una versión anterior (guardada en su
    # caché), recibiría HTML donde esperaba JavaScript, se negaría a ejecutarlo
    # por el tipo MIME y dejaría la pantalla **en blanco sin ningún error
    # visible**: el 200 hace que ni en las herramientas de desarrollo se vea
    # como un fallo. Un asset que no existe tiene que ser un 404 de verdad.
    location /admin/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El index.html nunca se cachea. Es el que apunta al bundle del momento, y
    # si el navegador guardara una copia vieja seguiría pidiendo archivos que ya
    # no existen. `no-cache` no prohíbe guardar, sino que obliga a revalidar
    # antes de usar, que es justo lo que hace falta aquí.
    #
    # Van las dos rutas porque el mismo archivo se alcanza por las dos: `/admin`
    # sin barra final no entra en `location /admin/` y cae en `location /`, y las
    # rutas internas de la SPA (por ejemplo `/admin/mensajes`) se resuelven hacia
    # `/admin/index.html`.
    location = /admin/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache";
    }

    # Backoffice vive bajo /admin vía traefik (PATH-BASED).
    # alias hace que /admin/** apunte a la raíz real del app.
    # (Con la variante host-based esto no haría falta.)
    location /admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}