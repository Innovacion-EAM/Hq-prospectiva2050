    #   rule: "Host(`localhost`)"
    #   entryPoints:
    #     - web
    #   service: frontend
    # backoffice:
    #   rule: "Host(`backoffice.localhost`)"
    #   entryPoints:
    #     - web
    #   service: backoffice
    # repo:
    #   rule: "Host(`repo.localhost`)"
    #   entryPoints:
    #     - web
    #   service: repo
    # api:
    #   rule: "Host(`api.localhost`)"
    #   entryPoints:
    #     - web
    #   service: api