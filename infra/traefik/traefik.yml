# ── Traefik: config ESTÁTICA (motor del proxy) ─────────────────────────
# Se carga 1 sola vez al arrancar (por eso va en archivo y no en flags
# del compose). Necesita REINICIO de traefik cuando cambie.
# La config dinámica (rutas/servicios) vive en dynamic/ y se recarga sola.
# ⚠ Sin provider docker a propósito: nuestro traefik v3.5 reporta API docker
#   1.24 y el daemon (Docker 29+) exige ≥1.40. Enrutamos 100% por archivos
#   (dynamic/) → no se necesita el socket docker.

# Dashboard bindeado a 127.0.0.1:8080 vía entryPoint traefik
api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  traefik:
    address: ":8080"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
    # Plantillas GO: los routers usan `{{ env "HQ_SITE_HOST" }}` (ver
    # dynamic/routes.yml) para matchear el dominio real, la IP pública o
    # localhost. En Traefik v3 el templating NO se activa con una opción: está
    # siempre disponible en los archivos de dynamic/ (el campo
    # `providers.file.template` que existía en v2 ya no es válido en v3 — si se
    # pone, Traefik no arranca: "field not found, node: template"). La variable
    # nunca falta: el compose la pasa con valor por defecto localhost y .env.prod
    # la fija con el dominio real.

# ─────────────────────────────────────────────────────────────────
# Resolver de Let's Encrypt (ACME) — CONFIG ESTÁTICA, ACTIVO
# ─────────────────────────────────────────────────────────────────
# ⚠ `certificatesResolvers` va SIEMPRE en el PRIMER NIVEL de esta config
#   estática. NO dentro de `tls:` (eso es de la config dinámica y, aquí,
#   Traefik ni arranca). Y solo es válido en ESTE fichero: si se mete en un
#   fichero de dynamic/, Traefik descarta el fichero ENTERO y se queda con
#   CERO routers (todo el sitio responde 404). Ya pasó: no lo muevas.
#
# Método HTTP-01: Let's Encrypt comprueba que el dominio es tuyo haciéndole
# una petición automática por el puerto 80, y Traefik la responde. No hace
# falta token del DNS ni que nadie entregue certificados. Requisitos (ambos
# ya cumplidos): el registro A del dominio apunta a la instancia y el 80 está
# abierto desde internet. El challenge convive sin problema con la
# redirección http→https.
certificatesResolvers:
  letsencrypt:
    acme:
      # Let's Encrypt usa este correo para avisar de caducidades.
      email: prospectiva@horizontequindio2050.com
      storage: /etc/traefik/certs/acme.json
      httpChallenge:
        entryPoint: web
#
# ── ALTERNATIVA (solo si el 80 no pudiera estar abierto o hubiera un CDN por
#    delante): validación por DNS. Requiere credenciales del proveedor de DNS
#    y un proveedor soportado por Lego (Hostinger NO lo está). Se sustituiría
#    `httpChallenge:` por:
#
#      dnsChallenge:
#        provider: cloudflare
#        resolvers:
#          - "1.1.1.1:53"
#
#    El directorio /etc/traefik/certs está montado como volumen
#    (docker-compose.yml), así que acme.json sobrevive a los despliegues y la
#    renovación es automática. No lo borres a mano.
# ─────────────────────────────────────────────────────────────────

# Endpoint /ping usado por el healthcheck del compose
ping: true

log:
  level: INFO